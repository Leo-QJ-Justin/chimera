[project]
name = "PROJECT"
version = "0.1.0"
description = "Production ML pipelines: data, training, inference, evaluation."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "hydra-core>=1.3",
    "mlflow>=2.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
# One group per trainer that is not needed to run the scaffold as shipped.
# `trainer=lightgbm` and `trainer=mlp` each name their group in the error
# they raise, so a missing extra is a one-line fix, not a traceback hunt.
lightgbm = ["lightgbm>=4.0"]
torch = ["torch>=2.0", "early-stopping-pytorch>=1.0"]
# Hyperparameter search. Only hyperparameter_tune imports it.
tune = ["optuna>=3.6"]
dev = ["pytest>=8.0", "ruff>=0.5", "pyright>=1.1", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Rename target when the scaffold renames src/PROJECT/.
packages = ["src/PROJECT"]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
# ML naming conventions: X_train / X is an argument and a local, not a constant.
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
# Without this, `PROJECT.core` looks third-party in the template (the dir is
# empty until scaffold time) and first-party afterwards - and import sorting
# would flip the moment core lands. Rename with the package.
known-first-party = ["PROJECT", "conftest"]

[tool.ruff.lint.per-file-ignores]
# PROJECT is the scaffold placeholder and is not a valid module name. Delete
# this entry once the package has its real (snake_case) name.
"src/PROJECT/**" = ["N999"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
