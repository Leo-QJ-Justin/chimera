# @package _global_
#
# Sections every pipeline shares. `@package _global_` merges these at the
# config root instead of under a `shared:` key, so the pydantic schemas see
# `seed`, `logging`, `mlflow` directly. Pipeline configs list this group
# first and `_self_` last, so any value here can be overridden downstream.

seed: 42
timezone: Asia/Singapore

logging:
  level: INFO
  log_to_file: true
  log_dir: logs
  log_prefix: run
  timezone: Asia/Singapore
  # Set to null to use the programmatic console+file logger instead of the
  # dictConfig file (see configs/logging.yaml).
  config_path: configs/logging.yaml

mlflow:
  # On by default; the sqlite backend needs no server. Tracking failures
  # warn and never abort a run. Disable per invocation with
  # `mlflow.enabled=false`; <run_dir>/metrics.jsonl is written either way.
  # See README: Diagnostic artifacts / Model logging.
  enabled: true
  tracking_uri: sqlite:///mlflow.db
  experiment_name: PROJECT
  run_name: null
