# @package trainer
#
# Config group: pick with `python run_training.py trainer=mlp`. Requires the
# `torch` optional dependency group (torch + early-stopping-pytorch). The file
# is named for the architecture, `kind` for the family: another architecture
# is another trainer class overriding _build_model, plus its own file here.
kind: torch

# The architecture: what the saved checkpoint's shapes depend on, and what
# metadata.json carries to rebuild the module.
params:
  hidden_sizes: [128, 64]
  dropout: 0.2

# The harness: what the training loop does with that architecture.
torch:
  # Optimisation
  lr: 0.001
  weight_decay: 0.0
  epochs: 30
  batch_size: 32

  # Early stopping + checkpointing. `monitor` is the single source of truth
  # for "better": the early stopper and the LR scheduler both read it, so a
  # max-mode metric never needs a `Const - error` inversion hack.
  patience: 5
  monitor:
    name: val_loss   # any key emitted per epoch: train_loss|val_loss|train_metric|val_metric|lr
    mode: min        # min for loss-like, max for score-like

  # Plateau LR schedule (stepped on the monitored value, same mode).
  lr_factor: 0.5
  lr_patience: 2
  min_lr: 1.0e-6

  # Resume semantics are a named choice, not an implied behaviour:
  #   continue  - keep training the interrupted trajectory (last checkpoint)
  #   from_best - rewind to the best-monitored weights and branch
  resume: continue
  resume_from: null   # a prior run dir, e.g. outputs/training/20260730_120000

  # Sub-epoch sampling for large datasets: fraction of the training split
  # drawn per epoch via RandomSampler (re-drawn each epoch, never a break).
  subsample_frac: 1.0

  # Overfit-one-batch check before the real run. Opt-in: it costs seconds and
  # catches wiring bugs early, but it is noise in a tuning sweep.
  sanity_check: false

  # Host-side loader knobs - a property of the machine, not the architecture.
  num_workers: 0
  pin_memory: false

  # Device selection. `visible_devices` is written to the environment BEFORE
  # torch imports CUDA (see modules/device.py).
  device: auto            # auto -> cuda -> mps -> cpu; or "cuda:1" / "cpu"
  visible_devices: null   # e.g. "0,1"
  device_order: PCI_BUS_ID

  # Opt-in: deterministic cuDNN kernels. Slower, and raises on ops with no
  # deterministic implementation, so it is off by default.
  deterministic_cudnn: false

tune:
  # The search carves one 20% holdout off the rows it is handed - the
  # chronological tail under `split.mode: temporal` - and every trial runs a
  # full epoch loop monitored against it and is then scored on it (see
  # classes/torch_trainer.py), so the winning score is optimistic.
  enabled: false
  n_trials: 10
  # Not read by this search: k full epoch loops per trial would be the wrong
  # place to spend the budget. It is the fold count of the selection CV under
  # `selection.basis: cv`, which is k full epoch-loop fits - budget for it
  # before switching a torch run onto that basis.
  cv: 3
  metric: null        # project metric alias; null -> f1_macro (classification) / rmse (regression)
  # null -> inferred from the metric, so an error-like metric is minimised
  # rather than silently maximised. Set it only to override that.
  direction: null
  # Per-parameter overrides of the trainer's declared ranges, under the same
  # destination prefixes the suggestions use: `params__*` changes the
  # checkpoint's shapes, `options__*` changes what the loop does. Dropping
  # either architecture knob with `false` keeps the `hidden_sizes` above.
  # space:
  #   options__lr: {low: 1.0e-4, high: 1.0e-3, log: true}
  #   params__depth: false
