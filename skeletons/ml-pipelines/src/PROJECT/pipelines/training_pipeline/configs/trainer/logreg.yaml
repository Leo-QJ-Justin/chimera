# @package trainer
#
# Config group: pick with `python run_training.py trainer=logreg`.
#
# `kind` IS the family: it names the trainer class (classes/logreg_trainer.py),
# this file, and `model_type` in the saved metadata.
kind: logreg

# Passed straight to LogisticRegression's constructor, so an unknown name
# raises there rather than being ignored.
params:
  C: 1.0
  max_iter: 1000
  class_weight: null

tune:
  # Optuna over classes/logreg_trainer.py's own TUNABLE table (C, solver,
  # class_weight, and l1_ratio where the solver allows it). Off by default: a
  # tuned run costs n_trials * cv fits. Every trial is scored by this family's
  # own procedure CV, so a trial's number and best.json's number agree.
  enabled: false
  n_trials: 20
  # This family's fit never reads the validation split, so the folds run over
  # train+val pooled and `cv` also sets the fold count of the CV estimate
  # behind best.json - whether or not the search is enabled. Test is never
  # touched. See README: Two protocols.
  cv: 3
  # A *project metric alias* - the vocabulary evaluate() and the evaluation
  # report speak (f1_macro | accuracy | rmse | mae | r2), never a sklearn
  # scoring string. null -> the task default (f1_macro).
  metric: null
  # null -> inferred from the metric, so an error-like metric is minimised
  # rather than silently maximised. Set it only to override that.
  direction: null
  # Per-parameter overrides of the trainer's declared ranges. `false` drops a
  # name from the search entirely and leaves `params` above in charge of it;
  # a name this family does not tune raises, listing the ones it does.
  # space:
  #   C: {low: 0.01, high: 10.0, log: true}
  #   class_weight: false
