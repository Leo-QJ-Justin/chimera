# @package trainer
#
# Config group: pick with `python run_training.py trainer=logreg`.
#
# `kind` IS the family: it names the trainer class (classes/logreg_trainer.py),
# this file, and `model_type` in the saved metadata. `params` go straight to
# LogisticRegression's constructor, so a typo raises there, loudly.
kind: logreg

params:
  C: 1.0
  max_iter: 1000
  class_weight: null

tune:
  # Optuna over classes/logreg_trainer.py's own TUNABLE table (C, solver,
  # class_weight, and l1_ratio where the solver allows it). Off by default:
  # a tuned run costs n_trials * cv fits.
  #
  # Every trial is scored by this family's own procedure CV - a candidate
  # trainer, cross-validated exactly as the run will fit the winner, scored
  # through evaluate(). So a trial's number and best.json's number are the
  # same measurement.
  #
  # Pooled protocol (R1.10): this family's fit never reads the validation
  # split (uses_val_in_fit = False), so the folds below run over train+val
  # pooled, the final model is fitted on that pool, and `cv` also sets the
  # fold count of the CV estimate that decides best.json - whether or not
  # the search itself is enabled. Test is never touched.
  enabled: false
  n_trials: 20
  cv: 3
  # A *project metric alias* - the vocabulary evaluate() and the evaluation
  # report speak (f1_macro | accuracy | rmse | mae | r2), never a sklearn
  # scoring string. null -> the task default (f1_macro).
  metric: null
  # null -> inferred from the metric, so an error-like metric is minimised
  # rather than silently maximised. Set it only to override that.
  direction: null
  # Per-parameter overrides of the trainer's declared ranges. `false` drops a
  # name from the search entirely and leaves `params` above in charge of it;
  # a name this family does not tune raises, listing the ones it does.
  # space:
  #   C: {low: 0.01, high: 10.0, log: true}
  #   class_weight: false
