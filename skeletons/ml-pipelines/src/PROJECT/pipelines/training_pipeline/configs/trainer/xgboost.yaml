# @package trainer
#
# Config group: pick with `python run_training.py trainer=xgboost`.
# Requires the `xgboost` optional dependency group. Its own fit path, for the
# reason LightGBM has one; early_stopping_rounds is a constructor argument in
# xgboost >= 1.6 and raises with no eval_set, so the trainer attaches it only
# when there is a validation split.
kind: xgboost

params:
  n_estimators: 500
  # xgboost's `eta`, under the sklearn API's name for it.
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.9
  colsample_bytree: 0.9
  min_child_weight: 1

xgboost:
  # Early stopping on the validation split. null disables it and trains the
  # full n_estimators.
  early_stopping_rounds: 50
  # Rounds between eval-log lines; 0 silences the per-round log.
  log_period: 0

tune:
  # Requires the `tune` extra (optuna). As with LightGBM, the search carves
  # one 20% holdout off the rows it is handed - the chronological tail under
  # `split.mode: temporal` - and every trial early-stops against it and is
  # then scored on it, so the winning score is optimistic; test is untouched.
  enabled: false
  n_trials: 20
  # Not read by this search. It sets the fold count of the selection CV under
  # `selection.basis: cv`, which also early-stops: each fold carves its own
  # stopping subset out of its training rows.
  cv: 3
  # A *project metric alias* - the vocabulary evaluate() and the evaluation
  # report speak (f1_macro | accuracy | rmse | mae | r2), never a sklearn
  # scoring string. null -> the task default (f1_macro / rmse).
  metric: null
  # null -> inferred from the metric, so an error-like metric is minimised
  # rather than silently maximised. Set it only to override that.
  direction: null
  # Per-parameter overrides of the trainer's declared ranges. `false` drops a
  # name from the search entirely and leaves `params` above in charge of it;
  # a name this family does not tune raises, listing the ones it does.
  # space:
  #   max_depth: {low: 3, high: 8}
  #   subsample: false
