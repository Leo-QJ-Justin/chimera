# @package trainer
#
# Config group: pick with `python run_training.py trainer=lightgbm`.
# Requires the `lightgbm` optional dependency group.
#
# Its own fit path, because `eval_set` early stopping needs the
# *transformed* validation matrix, which a sklearn Pipeline's fit signature
# cannot carry.
kind: lightgbm

params:
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20
  verbose: -1

lightgbm:
  # Early stopping on the validation split. null disables it and trains the
  # full n_estimators - the right choice only when there is no validation
  # split to stop on.
  early_stopping_rounds: 50
  # Rounds between eval-log lines; 0 silences the per-round log.
  log_period: 0

tune:
  # Requires the `tune` extra (optuna). The tuning CV has no validation
  # split to early-stop on, so trials train the full n_estimators; the
  # early-stopped fit is what the final train produces.
  #
  # `cv` doubles as the fold count of the selection CV under
  # `selection.basis: cv` (R1.11) - and that CV *does* early-stop, because
  # each fold carves its own stopping subset out of its training rows.
  enabled: false
  n_trials: 20
  cv: 3
  metric: null
  direction: maximize
