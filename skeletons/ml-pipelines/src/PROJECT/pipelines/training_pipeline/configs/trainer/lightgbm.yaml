# @package trainer
#
# Config group: pick with `python run_training.py trainer=lightgbm`.
# Requires the `lightgbm` optional dependency group.
#
# Its own fit path, because `eval_set` early stopping needs the
# *transformed* validation matrix, which a sklearn Pipeline's fit signature
# cannot carry - and its own tuner, because a booster with no referee to
# stop against is not the fit this file describes.
kind: lightgbm

params:
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20
  verbose: -1

lightgbm:
  # Early stopping on the validation split. null disables it and trains the
  # full n_estimators - the right choice only when there is no validation
  # split to stop on.
  early_stopping_rounds: 50
  # Rounds between eval-log lines; 0 silences the per-round log.
  log_period: 0

tune:
  # Requires the `tune` extra (optuna). The search carves one 20% holdout
  # off the rows it is handed - the chronological tail under
  # `split.mode: temporal` - and every trial early-stops against it and is
  # then scored on it. So a trial is shaped like the fit the run ships, and
  # a winning n_estimators is a ceiling that was stopped short of. Known
  # bias: a trial is scored on the rows it stopped against, so the winning
  # score is optimistic; test stays untouched.
  #
  # `cv` is NOT read by this search. It still sets the fold count of the
  # selection CV under `selection.basis: cv` (R1.11) - and that CV also
  # early-stops, because each fold carves its own stopping subset out of its
  # training rows.
  enabled: false
  n_trials: 20
  cv: 3
  # A *project metric alias* - the vocabulary evaluate() and the evaluation
  # report speak (f1_macro | accuracy | rmse | mae | r2), never a sklearn
  # scoring string. null -> the task default (f1_macro / rmse).
  metric: null
  # null -> inferred from the metric, so an error-like metric is minimised
  # rather than silently maximised. Set it only to override that.
  direction: null
  # Per-parameter overrides of the trainer's declared ranges. `false` drops a
  # name from the search entirely and leaves `params` above in charge of it;
  # a name this family does not tune raises, listing the ones it does.
  # space:
  #   learning_rate: {low: 0.02, high: 0.1, log: true}
  #   n_estimators: false
