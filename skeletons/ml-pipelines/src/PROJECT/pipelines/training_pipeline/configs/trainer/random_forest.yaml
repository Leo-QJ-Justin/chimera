# @package trainer
#
# Config group: pick with `python run_training.py trainer=random_forest`.
#
# Handles both tasks: the trainer picks RandomForestClassifier or
# RandomForestRegressor from the run's `task`.
kind: random_forest

params:
  n_estimators: 300
  max_depth: null
  min_samples_leaf: 1
  max_features: sqrt

tune:
  # Optuna over classes/random_forest_trainer.py's own TUNABLE table
  # (n_estimators, max_depth, min_samples_leaf, max_features). Every trial is
  # scored by this family's own procedure CV, so a trial's number and
  # best.json's number agree.
  enabled: false
  n_trials: 20
  # This family's fit never reads the validation split, so the folds run over
  # train+val pooled and `cv` also sets the fold count of the CV estimate
  # behind best.json - whether or not the search is enabled. Test is never
  # touched. See README: Two protocols.
  cv: 3
  # A *project metric alias* - the vocabulary evaluate() and the evaluation
  # report speak (f1_macro | accuracy | rmse | mae | r2), never a sklearn
  # scoring string. null -> the task default (f1_macro / rmse).
  metric: null
  # null -> inferred from the metric, so an error-like metric is minimised
  # rather than silently maximised. Set it only to override that.
  direction: null
  # Per-parameter overrides of the trainer's declared ranges. `false` drops a
  # name from the search entirely and leaves `params` above in charge of it;
  # a name this family does not tune raises, listing the ones it does.
  # space:
  #   n_estimators: {low: 200, high: 400, step: 50}
  #   max_depth: false
